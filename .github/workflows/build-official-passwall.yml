name: Build NX30Pro official 25.12.2 + PassWall (ImageBuilder)

# 用官方 ImmortalWrt 25.12.2 ImageBuilder 重新组包：
# 与设备上正在运行的系统同源同 profile，只多加 PassWall / sing-box / geosite。
# 不走全量编译，不碰 bootloader，产物只有一个 squashfs-sysupgrade.itb。

on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai
  IB_URL: https://downloads.immortalwrt.org/releases/25.12.2/targets/mediatek/filogic/immortalwrt-imagebuilder-25.12.2-mediatek-filogic.Linux-x86_64.tar.zst
  KMOD_URL: https://downloads.immortalwrt.org/releases/25.12.2/targets/mediatek/filogic/kmods/6.12.103-1-b5b7729ffbba3ecdd83f339de8fadfb8

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 环境准备
        run: |
          sudo apt-get -yqq update
          sudo -E apt-get -yqq install -y zstd curl
          sudo timedatectl set-timezone "$TZ"
          df -hT /

      - name: 下载并解包 ImageBuilder
        run: |
          mkdir -p "$RUNNER_TEMP/ib"
          cd "$RUNNER_TEMP/ib"
          curl -fL --retry 3 --retry-delay 5 -o ib.tar.zst "$IB_URL"
          ls -lh ib.tar.zst
          tar --zstd -xf ib.tar.zst
          rm -f ib.tar.zst
          IB="$(ls -d immortalwrt-imagebuilder-*)"
          echo "IB_DIR=$RUNNER_TEMP/ib/$IB" >> "$GITHUB_ENV"
          echo "解包到: $IB"

      - name: 探查仓库配置
        run: |
          cd "$IB_DIR"
          echo "=== 根目录 ==="
          ls -la
          echo "=== repositories 相关文件 ==="
          find . -maxdepth 4 \( -iname '*repositor*' -o -name 'distfeeds*' -o -name '*.list' \) -print 2>/dev/null | head -20 || true
          echo "=== Makefile / include 里的仓库定义 ==="
          grep -rnE 'downloads\.immortalwrt|src/gz|repositor' Makefile include/ 2>/dev/null | head -20 || true

      - name: 追加内核模块仓库（自适应）
        run: |
          cd "$IB_DIR"
          TARGET=""
          for f in repositories.conf etc/apk/repositories.d/distfeeds.list etc/apk/repositories etc/opkg/distfeeds.conf; do
            if [ -f "$f" ]; then TARGET="$f"; break; fi
          done
          if [ -z "$TARGET" ]; then
            echo "::warning::未找到仓库配置文件，跳过 kmods 追加（若构建报缺 kmod 再处理）"
            exit 0
          fi
          echo "配置文件: $TARGET"
          cat "$TARGET"
          if grep -q "kmods" "$TARGET"; then
            echo "已含 kmods，跳过"
          elif grep -qE '^src/' "$TARGET"; then
            echo "src/gz kmods $KMOD_URL" >> "$TARGET"
            echo "已追加 src/gz 形式"
          else
            echo "$KMOD_URL" >> "$TARGET"
            echo "已追加裸 URL 形式"
          fi
          echo "--- 追加后 ---"
          cat "$TARGET"

      - name: 构建镜像
        run: |
          set -o pipefail
          cd "$IB_DIR"
          make image \
            PROFILE=h3c_magic-nx30-pro \
            PACKAGES="-dnsmasq dnsmasq-full luci-app-passwall luci-i18n-passwall-zh-cn v2ray-geosite kmod-zram zram-swap" \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log" | tail -120
          echo "=== 产物目录 ==="
          ls -lh bin/targets/mediatek/filogic/ || true

      - name: 校验体积与包清单
        run: |
          cd "$IB_DIR"
          D=bin/targets/mediatek/filogic
          ITB=$(ls $D/*squashfs-sysupgrade.itb 2>/dev/null | head -1)
          if [ -z "$ITB" ]; then echo "!!! 没有产出 sysupgrade.itb，构建失败"; exit 1; fi
          SZ=$(stat -c%s "$ITB")
          MB=$(awk "BEGIN{printf \"%.2f\", $SZ/1048576}")
          echo "镜像: $(basename $ITB)"
          echo "大小: $SZ 字节 = $MB MB"
          # fit 卷 + u-boot-env 之后剩余即为 rootfs_data：61.7MB 可用总量，留 6MB 底线
          [ "$SZ" -lt 33554432 ] || { echo "!!! 超过 32MB，会压到 U-Boot 的内核加载区 0x48000000，终止"; exit 1; }
          echo "overlay 预计 $(( (61700000 - SZ) / 1048576 ))MB（61.7MB - fit - u-boot-env）"
          MAN=$(ls $D/*.manifest 2>/dev/null | head -1)
          if [ -z "$MAN" ]; then echo "!!! 没有 manifest，无法校验包清单"; exit 1; fi
          echo "=== 关键包校验 ==="
          for p in luci-app-passwall v2ray-geosite dnsmasq-full; do
            if grep -q "^$p " "$MAN"; then echo "OK   $p"; else echo "!!! 清单缺少 $p"; exit 1; fi
          done
          echo "=== 透明代理所需内核模块 ==="
          grep -E '^kmod-(nft-tproxy|nft-socket|nf-tproxy|nft-core|zram) ' "$MAN" || echo "(不在清单中，可能在依赖里)"
          echo "=== sha256 ==="
          sha256sum "$ITB" | tee "$GITHUB_WORKSPACE/sha256.txt"

      - name: 收集产物
        if: ${{ always() }}
        run: |
          cd "$IB_DIR"
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp bin/targets/mediatek/filogic/*squashfs-sysupgrade.itb "$GITHUB_WORKSPACE/out/"
          cp bin/targets/mediatek/filogic/*.manifest "$GITHUB_WORKSPACE/out/" || true
          cp "$GITHUB_WORKSPACE/sha256.txt" "$GITHUB_WORKSPACE/out/" || true
          ls -lh "$GITHUB_WORKSPACE/out/"

      - name: 上传 artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: NX30Pro-25.12.2-passwall
          path: |
            out/
            build.log
          if-no-files-found: warn
