name: Build NX30Pro (P大 24.10-6.6 + PassWall)

# 手动触发。可选打开 SSH 调试（编译卡住时进去看）
on:
  workflow_dispatch:
    inputs:
      ssh:
        description: '开启 SSH 调试 (true/false)'
        required: false
        default: 'false'

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-6.6
  REPO_BRANCH: openwrt-24.10-6.6
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 检出本仓库
      uses: actions/checkout@v4

    - name: 清理磁盘空间
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                    /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
        df -hT

    - name: 初始化编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -yqq update
        sudo -E apt-get -yqq install -y dos2unix libfuse-dev
        sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: 克隆源码
      working-directory: /workdir
      run: |
        git clone $REPO_URL -b $REPO_BRANCH --single-branch --depth=1 openwrt
        ln -sfn /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: 更新 Feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: 加载自定义 Feeds (diy-part1)
      run: |
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 加载配置 + 替换核心 (diy-part2)
      run: |
        chmod +x $DIY_P2_SH
        cp -f $CONFIG_FILE openwrt/.config
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: SSH 调试（可选）
      # 注意：mxschmitt/action-tmate 公共服务器 2025-07 已关停，切勿换回
      uses: owenthereal/action-upterm@v2
      if: ${{ github.event.inputs.ssh == 'true' }}
      with:
        # 没人连进来时 5 分钟后自动继续，避免 workflow 一直挂着
        wait-timeout-minutes: 5

    - name: 下载依赖包
      id: package
      run: |
        cd openwrt
        echo "=== defconfig 前的设备行 ==="
        grep -E 'CONFIG_TARGET_PROFILE|CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_h3c_magic-nx30-pro' .config || true
        make defconfig
        echo "=== 校验关键配置（defconfig 之后） ==="
        grep -E 'CONFIG_TARGET_PROFILE|CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_h3c_magic-nx30-pro|CONFIG_PACKAGE_luci-app-passwall=y|CONFIG_PACKAGE_wpad-openssl=y|CONFIG_PACKAGE_kmod-mt_wifi=y' .config || true
        # 硬校验①：单设备模式必须同时有 DEVICE=y 和 PROFILE（缺一个就会被 defconfig 丢弃设备）
        grep -q '^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_h3c_magic-nx30-pro=y' .config || { echo "!!! defconfig 后设备符号丢失，终止"; exit 1; }
        grep -q '^CONFIG_TARGET_PROFILE="DEVICE_h3c_magic-nx30-pro"' .config || { echo "!!! defconfig 后 PROFILE 丢失，终止"; exit 1; }
        ! grep -q '^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_h3c_magic-nx30-pro-nmbm=y' .config || { echo "!!! 误选 nmbm，终止"; exit 1; }
        ! grep -q '^CONFIG_TARGET_PROFILE="DEVICE_h3c_magic-nx30-pro-nmbm"' .config || { echo "!!! 误选 nmbm PROFILE，终止"; exit 1; }
        # 硬校验②：PassWall / 闭源驱动 / wpad 必须在
        grep -q '^CONFIG_PACKAGE_luci-app-passwall=y' .config || { echo "!!! PassWall 丢失，终止"; exit 1; }
        grep -q '^CONFIG_PACKAGE_kmod-mt_wifi=y' .config || { echo "!!! 闭源 mt_wifi 丢失，终止"; exit 1; }
        echo "OK: 设备(PROFILE+DEVICE)与关键包校验通过"
        make download -j8
        find dl -size -1024c -exec rm -f {} \;

    - name: 编译固件
      id: compile
      run: |
        cd openwrt
        make -j$(nproc) || make -j1 V=s
        echo "=== 编译产物 ==="
        find bin/targets/mediatek/filogic -type f \( -name '*.itb' -o -name '*.bin' \) -exec ls -lh {} \;

    - name: 整理固件
      if: ${{ always() && steps.compile.outcome == 'success' }}
      run: |
        mkdir -p firmware
        find openwrt/bin/targets/mediatek/filogic -type f \( -name '*.itb' -o -name '*.bin' \) -exec cp {} firmware/ \;
        ls -lh firmware/
        echo "=== 必需文件校验 ==="
        for kw in initramfs-recovery squashfs-sysupgrade preloader bl31-uboot; do
          if ! ls firmware/ | grep -q "$kw"; then echo "!!! 缺少 $kw"; exit 1; fi
        done
        echo "OK: 四类文件齐全"

    - name: 上传固件
      if: ${{ always() && steps.compile.outcome == 'success' }}
      uses: actions/upload-artifact@v4
      with:
        name: NX30Pro-firmware
        path: firmware/
        if-no-files-found: error

    - name: 发布到 Releases
      if: ${{ always() && steps.compile.outcome == 'success' }}
      uses: softprops/action-gh-release@v2
      with:
        tag_name: nx30pro-${{ github.run_number }}
        name: NX30Pro P大24.10-6.6 + PassWall
        files: firmware/*
        generate_release_notes: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
